description: >-
  Rogue Wave Software was a developer-tools and high-performance-computing software company
  known for products such as TotalView, Klocwork, IMSL numerical libraries, PV-WAVE, and its
  Zend PHP and open-source support lines. It was acquired by Perforce Software in 2019 and the
  brand has since been fully absorbed into Perforce; the historical roguewave.com domain now
  301-redirects wholesale to perforce.com. It was surfaced as a portfolio company of
  battery-ventures and added to the API Evangelist network as a stub. This enrichment pass
  found no independent Rogue Wave API surface, developer portal, documentation, or
  well-known endpoints — everything resolves to Perforce.
